name: Deploy strategy code

# Deploys code from the PRIVATE repo (trading-strategy-azure) onto an
# already-existing VM. The equivalent of the manual "git pull +
# systemctl restart" we used to do on Oracle — here it's a single click
# (workflow_dispatch), per section 4 of the original outline ("CI/CD via
# GitHub Actions instead of manual git pull").
#
# REQUIRES "Deploy infrastructure" to have already run (the VM must
# already exist) — this is a deliberate, separate step, since the VM is
# deploy-on-demand and its IP address changes on every redeploy.
on:
  workflow_dispatch:
    inputs:
      vmIp:
        description: 'VM public IP address (the "vmPublicIp" output from the Deploy infrastructure workflow)'
        required: true
      strategyRepoRef:
        description: 'Branch/tag/commit in the private strategy repo to deploy'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo (systemd unit template)
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout private strategy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STRATEGY_REPO }}   # e.g. "your-user/trading-strategy-azure"
          ref: ${{ github.event.inputs.strategyRepoRef }}
          token: ${{ secrets.STRATEGY_REPO_PAT }}  # fine-grained PAT, "Contents: Read" on this one repo only
          path: strategy

      - name: Copy strategy code to the VM (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.event.inputs.vmIp }}
          username: azadmin
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: 'strategy/*,infra/systemd/trading-strategy.service'
          target: '/tmp/deploy-staging'
          strip_components: 0

      - name: Install dependencies and restart the service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.vmIp }}
          username: azadmin
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Application code -> /opt/trading-strategy (created by cloud-init in vm.bicep)
            sudo rsync -a --delete /tmp/deploy-staging/strategy/ /opt/trading-strategy/ \
              --exclude '.git' --exclude 'README.md'

            # systemd unit -> /etc/systemd/system (idempotent: overwrites if it already exists)
            sudo cp /tmp/deploy-staging/infra/systemd/trading-strategy.service \
              /etc/systemd/system/trading-strategy.service

            # Python dependencies in the venv prepared by cloud-init
            if [ -f /opt/trading-strategy/requirements.txt ]; then
              sudo /opt/trading-strategy/venv/bin/pip install -r /opt/trading-strategy/requirements.txt
            fi

            sudo chown -R azadmin:azadmin /opt/trading-strategy

            sudo systemctl daemon-reload
            sudo systemctl enable trading-strategy.service
            sudo systemctl restart trading-strategy.service

            sleep 3
            sudo systemctl status trading-strategy.service --no-pager
            rm -rf /tmp/deploy-staging

      - name: Summary
        run: |
          echo "### Deployed strategy (ref: ${{ github.event.inputs.strategyRepoRef }}) to ${{ github.event.inputs.vmIp }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the logs: see docs/RUNBOOK.md, 'Viewing logs in Log Analytics'." >> "$GITHUB_STEP_SUMMARY"
