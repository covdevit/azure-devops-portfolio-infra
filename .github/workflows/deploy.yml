name: Deploy infrastructure

# Ręczne uruchomienie — to jest model "deploy na żądanie", nie ciągłe
# działanie. Uruchamiasz, gdy chcesz mieć VM stojącą (np. testujesz
# strategię), zdejmujesz przez teardown.yml, gdy skończyłeś.
on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Nazwa środowiska (trafia do nazw zasobów)'
        required: false
        default: 'dev'
      location:
        description: 'Region Azure'
        required: false
        default: 'polandcentral'

permissions:
  id-token: write   # wymagane do wymiany tokenu OIDC z Azure AD
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # opcjonalnie: skonfiguruj required reviewers w Settings -> Environments
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, bez client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (subscription scope)
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ github.event.inputs.location }}
          template: bicep/main.bicep
          parameters: >
            bicep/parameters/main.parameters.json
            environmentName=${{ github.event.inputs.environmentName }}
            location=${{ github.event.inputs.location }}
            adminSourceIp=${{ vars.ADMIN_SOURCE_IP }}
            adminSshPublicKey=${{ vars.ADMIN_SSH_PUBLIC_KEY }}
          deploymentName: infra-${{ github.run_id }}

      - name: Wypisz adres IP nowej VM
        run: |
          echo "### Deployment zakończony" >> "$GITHUB_STEP_SUMMARY"
          echo "Sprawdź output 'vmPublicIp' w kroku powyżej (Azure/arm-deploy)." >> "$GITHUB_STEP_SUMMARY"
          echo "Albo: az deployment sub show --name infra-${{ github.run_id }} --query properties.outputs" >> "$GITHUB_STEP_SUMMARY"
