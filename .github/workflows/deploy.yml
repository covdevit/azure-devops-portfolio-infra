name: Deploy infrastructure

# Manually triggered — this is the "deploy-on-demand" model, not something
# that runs continuously. You trigger it whenever you want the VM up (e.g.
# to test the strategy), and tear it down via teardown.yml when you're done.
on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (used in resource names)'
        required: false
        default: 'dev'
      location:
        description: 'Azure region'
        required: false
        default: 'polandcentral'

permissions:
  id-token: write   # required to exchange the OIDC token with Azure AD
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (subscription scope)
        # Calling az cli directly rather than the azure/arm-deploy action:
        # that action splits its "parameters" input on whitespace, which
        # breaks for values that legitimately contain spaces (an SSH public
        # key is "ssh-ed25519 AAAA... comment"). Plain shell quoting handles
        # this correctly, and it's the exact same command documented in
        # docs/RUNBOOK.md for manual deploys.
        run: |
          az deployment sub create \
            --location "${{ github.event.inputs.location }}" \
            --template-file bicep/main.bicep \
            --parameters bicep/parameters/main.parameters.json \
            --parameters environmentName="${{ github.event.inputs.environmentName }}" \
            --parameters location="${{ github.event.inputs.location }}" \
            --parameters adminSourceIp="${{ vars.ADMIN_SOURCE_IP }}" \
            --parameters adminSshPublicKey="${{ vars.ADMIN_SSH_PUBLIC_KEY }}" \
            --name "infra-${{ github.run_id }}"

      - name: Print the new VM's IP address
        run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          az deployment sub show --name "infra-${{ github.run_id }}" --query properties.outputs -o json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
