name: Deploy infrastructure

# Manually triggered — this is the "deploy-on-demand" model, not something
# that runs continuously. You trigger it whenever you want the VM up (e.g.
# to test the strategy), and tear it down via teardown.yml when you're done.
on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name (used in resource names)'
        required: false
        default: 'dev'
      location:
        description: 'Azure region'
        required: false
        default: 'polandcentral'

permissions:
  id-token: write   # required to exchange the OIDC token with Azure AD
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (subscription scope)
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ github.event.inputs.location }}
          template: bicep/main.bicep
          parameters: >
            bicep/parameters/main.parameters.json
            environmentName=${{ github.event.inputs.environmentName }}
            location=${{ github.event.inputs.location }}
            adminSourceIp=${{ vars.ADMIN_SOURCE_IP }}
            adminSshPublicKey=${{ vars.ADMIN_SSH_PUBLIC_KEY }}
          deploymentName: infra-${{ github.run_id }}

      - name: Print the new VM's IP address
        run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the 'vmPublicIp' output in the step above (Azure/arm-deploy)." >> "$GITHUB_STEP_SUMMARY"
          echo "Or: az deployment sub show --name infra-${{ github.run_id }} --query properties.outputs" >> "$GITHUB_STEP_SUMMARY"
