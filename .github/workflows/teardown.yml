name: Teardown infrastructure

# Deletes the entire resource group (and therefore every resource inside
# it) with a single command. This is the other half of the "deploy-on-
# demand" model — run it as soon as you're done with the VM, so you don't
# burn through the free-tier allowance / rack up charges.
on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Environment name to tear down (must match the one used at deploy time)'
        required: false
        default: 'dev'
      confirm:
        description: 'Type exactly: TEARDOWN  (safeguard against accidental deletion)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "TEARDOWN" ]; then
            echo "::error::The 'confirm' field must contain exactly the word TEARDOWN. Aborting."
            exit 1
          fi

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete resource group
        run: |
          RG_NAME="tradingvm-${{ github.event.inputs.environmentName }}-rg"
          echo "Deleting resource group: $RG_NAME"
          az group delete --name "$RG_NAME" --yes --no-wait
          echo "Deletion requested (--no-wait) — Azure deletes in the background, check the portal in a few minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up Key Vault (soft-delete)
        run: |
          echo "Note: Key Vault has soft-delete enabled (7 days). If you want to"
          echo "free up the name immediately (e.g. for a quick redeploy the same day), uncomment:"
          echo "# az keyvault purge --name <kv-name> --location <region>"
          echo "The Key Vault name includes a random suffix (uniqueString), so a"
          echo "name collision on the next deploy is unlikely even without purging."
