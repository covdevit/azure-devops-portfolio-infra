name: Teardown infrastructure

# Usuwa całą resource group (a więc wszystkie zasoby w środku) jedną
# komendą. To druga połowa modelu "deploy na żądanie" — uruchamiasz to
# zaraz po tym, jak skończyłeś z VM, żeby nie zużywać darmowego limitu
# / nie generować kosztów.
on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Nazwa środowiska do usunięcia (musi się zgadzać z tym użytym przy deployu)'
        required: false
        default: 'dev'
      confirm:
        description: 'Wpisz dokładnie: TEARDOWN  (zabezpieczenie przed przypadkowym usunięciem)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Sprawdź potwierdzenie
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "TEARDOWN" ]; then
            echo "::error::Pole 'confirm' musi zawierać dokładnie słowo TEARDOWN. Przerywam."
            exit 1
          fi

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Usuń resource group
        run: |
          RG_NAME="tradingvm-${{ github.event.inputs.environmentName }}-rg"
          echo "Usuwam resource group: $RG_NAME"
          az group delete --name "$RG_NAME" --yes --no-wait
          echo "Usunięcie zlecone (--no-wait) — Azure kasuje w tle, sprawdź w portalu za kilka minut." >> "$GITHUB_STEP_SUMMARY"

      - name: Wyczyść Key Vault (soft-delete)
        run: |
          echo "Uwaga: Key Vault ma soft-delete (7 dni). Jeśli chcesz od razu"
          echo "zwolnić nazwę (np. przy szybkim redeploy w tym samym dniu), odkomentuj:"
          echo "# az keyvault purge --name <nazwa-kv> --location <region>"
          echo "Nazwa Key Vault zawiera losowy suffix (uniqueString), więc"
          echo "kolizja nazw przy kolejnym deployu jest mało prawdopodobna nawet bez purge."
